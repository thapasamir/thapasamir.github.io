<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Silkscreen:wght@400;700&display=swap">
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
  {% if page.desk %}<script>try{if(!sessionStorage.booted&&matchMedia('(min-width:821px)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches)document.documentElement.classList.add('booting')}catch(e){}</script>{% endif %}
</head>
<body>
  {% include sprite.html %}
  {% if page.desk %}{% include menubar-desk.html %}{% include boot.html %}{% else %}{% include menubar.html %}{% endif %}
  {{ content }}
  <script src="{{ '/js/clock.js' | relative_url }}"></script>
  {% if page.desk %}<script src="{{ '/js/desktop.js' | relative_url }}"></script>{% endif %}
</body>
</html>
